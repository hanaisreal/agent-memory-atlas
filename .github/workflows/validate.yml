name: validate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate data
        run: python3 scripts/build.py --check
      - name: Built atlas.json is up to date
        run: |
          python3 scripts/build.py
          git diff --exit-code site/atlas.json
